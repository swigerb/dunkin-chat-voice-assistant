# Centralized configuration for Dunkin Voice Chat Assistant backend.
# Changes take effect on next startup.

model:
  temperature: 0.6
  max_response_output_tokens: 4096
  # Default realtime voice for the Dunkin crew persona. OpenAI recommends marin
  # or cedar on gpt-realtime-2.x. Keep in sync with DEFAULT_VOICE in
  # app/frontend/src/lib/voices.ts. AZURE_OPENAI_REALTIME_VOICE_CHOICE overrides.
  default_voice: "marin"
  # Input transcription model sent in every session.update. On Azure this is a
  # deployment name; whisper-1 is served by the realtime deployment itself.
  # Override with AZURE_OPENAI_REALTIME_TRANSCRIPTION_MODEL.
  transcription_model: "whisper-1"
  # reasoning.effort for reasoning realtime models (gpt-realtime-2 / 2.1):
  # none | minimal | low | medium | high | xhigh. "" (or off) omits `reasoning`.
  # Override with AZURE_OPENAI_REALTIME_REASONING_EFFORT.
  reasoning_effort: "low"
  # Whether the deployment accepts `reasoning` / `parallel_tool_calls`:
  # auto (infer from the deployment name; gpt-realtime-1.5 / gpt-4o are not
  # reasoning models) | true | false. Override with
  # AZURE_OPENAI_REALTIME_REASONING_MODEL. Rolling back to gpt-realtime-1.5 is
  # safe with "auto": nothing reasoning-only is sent.
  reasoning_model: "auto"
  # parallel_tool_calls for reasoning models; null leaves the service default.
  parallel_tool_calls: null

vad:
  type: "server_vad"
  threshold: 0.7
  prefix_padding_ms: 300
  silence_duration_ms: 500

business_rules:
  tax_rate: 0.08
  max_item_quantity: 10
  max_order_items: 25
  # Afternoon Iced & Espresso Happy Hour — 2 PM to 5 PM store-local time.
  # Eligible categories: iced drinks, cold brew, refreshers, and espresso-based.
  happy_hour_start: 14
  happy_hour_end: 17
  happy_hour_discount: 0.75  # 25% off eligible items
  happy_hour_categories:
    - "cold beverages"
    - "signature lattes"

search:
  k_nearest_neighbors: 50
  top_results: 5
  timeout_seconds: 10
