# Flux GitRepository source and Kustomization entries for this site.
# Copy this directory for each physical site (e.g., example-site → store-042).
#
# OPERATOR: update the GitRepository URL and branch to point at YOUR fork/repo.
# Example: https://github.com/my-org/dunkin-chat-voice-assistant (branch: main)
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: dunkin-voice-gitops
  namespace: flux-system
spec:
  interval: 5m
  # OPERATOR: replace with your repository URL
  url: https://github.com/<your-org>/<your-repo>
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: dunkin-voice-gitops
  path: ./flux/infrastructure
  prune: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: infra
  sourceRef:
    kind: GitRepository
    name: dunkin-voice-gitops
  path: ./flux/apps
  prune: true
  timeout: 5m
