apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dunkin-voice-netpol
  namespace: dunkin-voice
spec:
  podSelector:
    matchLabels:
      app: dunkin-voice-assistant
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS to Azure OpenAI
    - to: []
      ports:
        - protocol: TCP
          port: 443
