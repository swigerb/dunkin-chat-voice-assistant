apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dunkin-voice-ingress
  namespace: dunkin-voice
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        # OPERATOR: replace <your-domain> with your site's FQDN
        # Example: dunkin.example.com
        - <your-domain>
      secretName: dunkin-tls
  defaultBackend:
    service:
      name: dunkin-voice-service
      port:
        number: 80
  rules:
    # OPERATOR: replace <your-domain> with your site's FQDN
    - host: <your-domain>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dunkin-voice-service
                port:
                  number: 80
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dunkin-voice-service
                port:
                  number: 80
